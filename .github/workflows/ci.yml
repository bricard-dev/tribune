name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - run: pnpm exec prisma validate

      - run: pnpm lint

      - run: pnpm test --run

      - run: pnpm build
        env:
          # Placeholders to satisfy env validation during static build.
          # No network calls happen — these never touch real services.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-min-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: ci-placeholder
          RESEND_FROM_EMAIL: ci@example.com
